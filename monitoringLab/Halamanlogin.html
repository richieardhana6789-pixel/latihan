<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LabGuard Monitoring</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Card Login -->
    <div class="w-full max-w-md bg-[#111827] border border-gray-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Glow Effect Background -->
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl mb-4 text-indigo-400">
                <i class="fa-solid fa-[#0b0f19] fa-microchip text-2xl text-indigo-400"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
                LabGuard <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-indigo-900/50 text-indigo-300 border border-indigo-700/50">Debian 13 Ready</span>
            </h1>
            <p class="text-sm text-gray-400 mt-2">Sistem Monitoring & Kontrol PC Lab Komputer</p>
        </div>

        <!-- Form Login -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5 relative z-10">
            
            <!-- Alert Error -->
            <div id="errorAlert" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-xl items-center gap-3">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="errorMessage">Username atau password salah!</span>
            </div>

            <!-- Input Username -->
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-2">Nama Pengguna / Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" id="username" required placeholder="Masukkan username" 
                           class="w-full pl-10 pr-4 py-2.5 bg-[#1f2937]/50 border border-gray-700/60 rounded-xl text-white placeholder-gray-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                </div>
            </div>

            <!-- Input Password -->
            <div>
                <label class="block text-xs font-medium text-gray-400 mb-2">Kata Sandi / Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full pl-10 pr-10 py-2.5 bg-[#1f2937]/50 border border-gray-700/60 rounded-xl text-white placeholder-gray-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-500 hover:text-gray-300">
                        <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Opsi Tambahan -->
            <div class="flex items-center justify-between text-xs text-gray-400">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded bg-gray-800 border-gray-700 text-indigo-600 focus:ring-indigo-500">
                    <span>Ingat saya</span>
                </label>
                <span class="text-indigo-400 hover:underline cursor-pointer" onclick="alert('Silakan hubungi Administrator Server Debian untuk reset akun.')">Lupa password?</span>
            </div>

            <!-- Tombol Submit -->
            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-indigo-600/20 active:scale-[0.98]">
                Masuk ke Dashboard
            </button>
        </form>

        <!-- Footer Modal -->
        <div class="mt-8 text-center text-xs text-gray-500 relative z-10">
            &copy; LabGuard Monitoring - Jaringan Lokal Server Debian 13
        </div>

    </div>

    <script>
        // Data akun resmi
        const validUsers = {
            "admin": "admin123",
            "guru": "guru123"
        };

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            const errorAlert = document.getElementById('errorAlert');

            if (validUsers[userVal] && validUsers[userVal] === passVal) {
                // Simpan status sesi login di browser
                localStorage.setItem('labguard_auth', 'true');
                localStorage.setItem('labguard_user', userVal);
                
                // Pindah ke halaman dashboard utama
                window.location.href = 'index.html';
            } else {
                errorAlert.classList.remove('hidden');
                errorAlert.classList.add('flex');
            }
        }
    </script>
</body>
</html>
